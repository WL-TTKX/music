<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>NFC 音乐卡</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#000;
  color:#fff;
  text-align:center;
  padding-top:40px;
  font-family:system-ui;
}
button{
  width:80%;
  padding:16px;
  margin:12px auto;
  font-size:16px;
  background:#222;
  color:#fff;
  border:1px solid #444;
  border-radius:8px;
}
button:active{
  background:#444;
}
#unlock{
  background:#1db954;
  color:#000;
  font-weight:bold;
}
#toggle{
  background:#444;
}
.footer{
  color:#888;
  font-size:12px;
  margin-top:30px;
}
</style>
</head>

<body>

<h2>🎵 NFC 音乐卡</h2>

<!-- 解锁按钮 -->
<button id="unlock">🔓 点击解锁播放</button>

<!-- 歌曲列表 -->
<div id="list" style="display:none">
  <button onclick="play(0)">歌曲一</button>
  <button onclick="play(1)">歌曲二</button>
  <button onclick="play(2)">歌曲三</button>

  <button onclick="togglePlay()" id="toggle">⏸ 暂停</button>
</div>

<audio id="player"></audio>

<div class="footer">Tap NFC · Tap Unlock · Enjoy Music</div>

<script>
const songs = ['music1.mp3','music2.mp3','music3.mp3'];
const player = document.getElementById('player');
const unlock = document.getElementById('unlock');
const list = document.getElementById('list');
const toggleBtn = document.getElementById('toggle');

// 解锁音频（关键步骤）
unlock.addEventListener('click', ()=>{
  player.play().then(()=>{
    player.pause();
    unlock.style.display = 'none';
    list.style.display = 'block';
  }).catch(()=>{
    alert('请再点一次解锁');
  });
});

// 播放指定歌曲
function play(i){
  player.src = songs[i];
  player.play();
  toggleBtn.innerText = '⏸ 暂停';
}

// 暂停 / 继续
function togglePlay(){
  if(player.paused){
    player.play();
    toggleBtn.innerText = '⏸ 暂停';
  }else{
    player.pause();
    toggleBtn.innerText = '▶ 继续';
  }
}
</script>

</body>
</html>
