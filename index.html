<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>NFC 音乐卡</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#000;
  color:#fff;
  text-align:center;
  padding-top:40px;
  font-family:system-ui;
}
button{
  width:80%;
  padding:16px;
  margin:12px auto;
  font-size:16px;
  background:#222;
  color:#fff;
  border:1px solid #444;
  border-radius:8px;
}
button:active{
  background:#444;
}
#toggle{
  background:#444;
}
.footer{
  color:#888;
  font-size:12px;
  margin-top:30px;
}
</style>
</head>

<body>

<h2>🎵 NFC 音乐卡</h2>

<div id="list">
  <button onclick="play(0)">歌曲一</button>
  <button onclick="play(1)">歌曲二</button>
  <button onclick="play(2)">歌曲三</button>

  <button onclick="togglePlay()" id="toggle">⏸ 暂停</button>
</div>

<audio id="player"></audio>

<script>
const songs = ['music1.mp3','music2.mp3','music3.mp3'];
const player = document.getElementById('player');
const toggleBtn = document.getElementById('toggle');

function play(i){
  player.src = songs[i];
  player.play().catch(()=>{
    alert('播放被浏览器阻止，请手动点击播放');
  });
  toggleBtn.innerText = '⏸ 暂停';
}

function togglePlay(){
  if(player.paused){
    player.play();
    toggleBtn.innerText = '⏸ 暂停';
  }else{
    player.pause();
    toggleBtn.innerText = '▶ 继续';
  }
}
</script>

<div class="footer">Tap NFC · Tap Song · Enjoy Music</div>

</body>
</html>
